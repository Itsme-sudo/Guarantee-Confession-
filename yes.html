<!DOCTYPE html>
<html>
<head>
  <title>She/He Said YES ❤️</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Reset default margins */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #ff4d6d; /* example background */
      display: flex;
      flex-direction: column;
    }

    body {
      justify-content: space-between; /* push footer to bottom */
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-top: 50px;
    }

    h2 {
      font-size: 2rem;
      margin: 20px 0;
    }

    p {
      font-size: 1.2rem;
      max-width: 500px;
      margin: 0 auto;
    }

    footer {
      margin-top: auto; /* ensures footer stays at bottom */
      padding: 10px 0;
      font-size: 0.9rem;
      color: #ffffffcc;
    }
  </style>
</head>
<body>

  <h1>Yayyy!!! 😍💖</h1>
  <h2>You just made me the happiest person 🥹</h2>

  <p>
    From this moment, every smile, every memory,
    every heartbeat is ours ❤️
  </p>

  <footer>made by Santosh Mahto</footer>
</body>
</html>
