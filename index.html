<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>You Can Only Say Yes 💍</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    h1 {
      margin-top: 80px;
      color: #fff;
      text-shadow: 2px 2px 5px #000;
    }

    button {
      padding: 15px 35px;
      font-size: 22px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      margin-top: 40px;
    }

    #no {
      position: absolute;
      background: #555;
      color: white;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-800px); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>So… will you be mine forever? 💖</h1>
  
  <button onclick="window.location.href='yes.html'">Yes 💍</button>
  
  <button id="no">NO 😏</button>

  <!-- Background music -->
 <!-- <audio autoplay loop>
    <source src="romance.mp3" type="audio/mpeg">
  </audio>
-->
    <audio id="bgMusic" loop>
    <source src="romance.mp3" type="audio/mpeg">
</audio>

<button id="yes">Yes ❤️</button>
<button id="no">No 💔</button>

<script>
const music = document.getElementById("bgMusic");

function playMusic() {
    music.play().catch(err => console.log(err));
}

document.getElementById("yes").addEventListener("click", playMusic);
document.getElementById("no").addEventListener("click", playMusic);
</script>
    
  <script>
    const noBtn = document.getElementById("no");

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("click", moveNo);

    function sayYes() {
      document.body.innerHTML = `
        <h1 style="margin-top:200px; color:white;">
          Yayyy!!! 😍❤️<br>
          I knew it! 💕
        </h1>
      `;
    }

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.bottom = "0px";
      heart.style.fontSize = Math.random() * 30 + 15 + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 5000);
    }, 300);
  </script>

</body>
</html>
